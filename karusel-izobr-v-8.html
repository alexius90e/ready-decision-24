<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/karusel-izobr-v-8.css" />
    <script src="./js/swiper-bundle.min.js" defer></script>
    <script src="./js/karusel-izobr-v-8.js" defer></script>
  </head>

  <body>
    <section class="karusel-izobr-v-8">
      <div class="container">
        <div class="karusel-izobr-v-8__gallery">
          <div class="karusel-izobr-v-8__gallery-top">
            <div class="swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <div class="karusel-izobr-v-8__slide">
                    <figure class="karusel-izobr-v-8__slide-figure">
                      <img
                        class="karusel-izobr-v-8__slide-figure-image"
                        src="./assets/karusel-izobr-v-8/light-grey.svg"
                        alt="photo"
                      />
                    </figure>
                    <div class="karusel-izobr-v-8__slide-text">Прозрачный цвет в две строки</div>
                  </div>
                </div>

                <div class="swiper-slide">
                  <div class="karusel-izobr-v-8__slide">
                    <figure class="karusel-izobr-v-8__slide-figure">
                      <img
                        class="karusel-izobr-v-8__slide-figure-image"
                        src="./assets/karusel-izobr-v-8/black.svg"
                        alt="photo"
                      />
                    </figure>
                    <div class="karusel-izobr-v-8__slide-text">Черный</div>
                  </div>
                </div>

                <div class="swiper-slide">
                  <div class="karusel-izobr-v-8__slide">
                    <figure class="karusel-izobr-v-8__slide-figure">
                      <img
                        class="karusel-izobr-v-8__slide-figure-image"
                        src="./assets/karusel-izobr-v-8/red.svg"
                        alt="photo"
                      />
                    </figure>
                    <div class="karusel-izobr-v-8__slide-text">Красный</div>
                  </div>
                </div>

                <div class="swiper-slide">
                  <div class="karusel-izobr-v-8__slide">
                    <figure class="karusel-izobr-v-8__slide-figure">
                      <img
                        class="karusel-izobr-v-8__slide-figure-image"
                        src="./assets/karusel-izobr-v-8/grey.svg"
                        alt="photo"
                      />
                    </figure>
                    <div class="karusel-izobr-v-8__slide-text">Серый</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="karusel-izobr-v-8__gallery-bottom">
            <div class="swiper">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <div class="karusel-izobr-v-8__slide">
                    <figure class="karusel-izobr-v-8__slide-figure">
                      <img
                        class="karusel-izobr-v-8__slide-figure-image"
                        src="./assets/karusel-izobr-v-8/green.svg"
                        alt="photo"
                      />
                    </figure>
                    <div class="karusel-izobr-v-8__slide-text">Зеленый</div>
                  </div>
                </div>

                <div class="swiper-slide">
                  <div class="karusel-izobr-v-8__slide">
                    <figure class="karusel-izobr-v-8__slide-figure">
                      <img
                        class="karusel-izobr-v-8__slide-figure-image"
                        src="./assets/karusel-izobr-v-8/blue.svg"
                        alt="photo"
                      />
                    </figure>
                    <div class="karusel-izobr-v-8__slide-text">Синий</div>
                  </div>
                </div>

                <div class="swiper-slide">
                  <div class="karusel-izobr-v-8__slide">
                    <figure class="karusel-izobr-v-8__slide-figure">
                      <img
                        class="karusel-izobr-v-8__slide-figure-image"
                        src="./assets/karusel-izobr-v-8/white.svg"
                        alt="photo"
                      />
                    </figure>
                    <div class="karusel-izobr-v-8__slide-text">Белый</div>
                  </div>
                </div>

                <div class="swiper-slide">
                  <div class="karusel-izobr-v-8__slide">
                    <figure class="karusel-izobr-v-8__slide-figure">
                      <img
                        class="karusel-izobr-v-8__slide-figure-image"
                        src="./assets/karusel-izobr-v-8/orange.svg"
                        alt="photo"
                      />
                    </figure>
                    <div class="karusel-izobr-v-8__slide-text">Оранжевый</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
